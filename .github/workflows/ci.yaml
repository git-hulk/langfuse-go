
name: CI Actions
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  workflow:
    name: Lint/Test

    strategy:
      matrix:
        go-version: [1.24.7]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{matrix.go-version}}
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.8.0
          install-mode: goinstall
          verify: false
          only-new-issues: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: make test
